name: proof
on: [push, pull_request, workflow_dispatch]
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: the ladder's logic, the page and the pins
        run: node --test test/ladder.test.mjs test/page.test.mjs
      # Pinned. An unpinned gate is a gate somebody else can change.
      - name: witness - try to break the kernel, then READ the verdict (must be CLEAN, nothing baselined)
        run: |
          git clone --depth 1 --branch v0.6 https://github.com/sjgant80-hub/witness.git /tmp/witness
          node /tmp/witness/witness.mjs mutate src/ladder.mjs --timeout 120000 --cap 1000 --test node --test test/ladder.test.mjs > verdict-ladder.txt 2>&1
          tail -3 verdict-ladder.txt
          grep -q '"clean": true' verdict-ladder.txt || { echo "::error::mutants survived in src/ladder.mjs"; exit 1; }
          node tools/gate-receipt.mjs ladder src/ladder.mjs verdict-ladder.txt --check
